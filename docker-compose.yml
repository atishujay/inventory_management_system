services:

  frontend:
    build: ./frontend

    container_name: inventory_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: always

  backend:
    build: ./backend

    container_name: inventory_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      - db

    restart: always

  db:
    image: postgres:15

    container_name: inventory_db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jay
      POSTGRES_DB: inventory_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: